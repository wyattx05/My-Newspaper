<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f1e8" />
    <meta name="description" content="A personal front page for the stories you follow." />
    <title>MyDaily — Front Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="paper">
      <header class="masthead">
        <div class="edition-line"><span id="edition-date">Wednesday, October 14</span><span class="edition-dot">•</span><span id="edition-label">Morning edition</span><time id="clock" aria-label="Current time">--:--</time></div>
        <div class="masthead-main">
          <a class="paper-name" href="./" aria-label="MyDaily front page">MyDaily<span class="name-period">.</span></a>
          <div class="masthead-note">A front page made for you</div>
        </div>
        <div class="rule-double" aria-hidden="true"></div>
        <div class="paper-nav">
          <span class="article-count" id="article-count">0 articles</span>
          <span class="nav-date" id="full-date">Your daily reading, in one place</span>
          <div class="display-controls">
            <button class="settings-toggle" id="settings-toggle" type="button" aria-label="Display settings" aria-expanded="false" aria-controls="settings-menu" title="Display settings">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9m4 0h3M4 17h3m4 0h9M13 4v6M7 14v6" /></svg>
            </button>
            <div class="settings-menu" id="settings-menu" aria-label="Display settings" hidden>
              <label><span>Hide thumbnails</span><input id="hide-thumbnails" type="checkbox" /></label>
              <label><span>Black &amp; white thumbnails</span><input id="grayscale-thumbnails" type="checkbox" /></label>
              <label><span>Dark mode</span><input id="dark-mode" type="checkbox" /></label>
            </div>
          </div>
        </div>
      </header>

      <section class="front-page" id="front-page" aria-labelledby="section-heading">
        <div class="section-heading"><h1 id="section-heading">The front page</h1><span class="section-aside">Selected reading · <span id="edition-short-date"></span></span></div>
        <p class="feed-status" id="feed-status" role="status" aria-live="polite">Loading your edition…</p>
        <div class="paper-grid" id="stories"></div>
      </section>

      <footer class="paper-footer"><span>Printed for curious minds.</span><span>Made for your morning read <span class="footer-star">✳</span></span></footer>
    </main>
    <script src="feeds.js"></script>
    <script src="app.js"></script>
  </body>
</html>
